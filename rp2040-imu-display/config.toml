[project]
name = "RP2040_IMU_Display"
version = "1.2.0"

[build]
main = "src/main.loom"
sources = ["src/*.loom"]
target = "thumbv6m-none-eabi"
cpu = "cortex-m0plus"
baremetal = true
uf2-output = true
assembly = ["boot.s", "src/memset.S"]
target-dir = "target"
executable = "RP2040_IMU_Display"

[toolchain]
clang = "clang"
